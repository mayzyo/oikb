name: Build and Publish oikb
run-name: ${{ gitea.actor }} is building oikb

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish alongside the full commit SHA (for example, 0.1.0)
        required: true
        default: latest
        type: string

permissions:
  contents: read

env:
  REGISTRY: registry.home.destinesiastudio.com
  OWNER: ${{ gitea.repository_owner }}
  SHA: ${{ gitea.sha }}
  IMAGE_TAG: ${{ gitea.event.inputs.tag || 'latest' }}
  BUILD_RUN_ID: ${{ gitea.run_id }}

jobs:
  test:
    runs-on: docker-build-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Python regression tests
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/astral-sh/uv:0.11.29-python3.11-bookworm-slim sh -ec 'UV_PROJECT_ENVIRONMENT=/tmp/test-venv uv run --frozen --extra dev pytest -q'
      - name: Log in for cross-repository contract test
        if: gitea.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: merrymaybe-bot
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Test connector against published gateway and real CLI
        if: gitea.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          network="oikb-contract-${BUILD_RUN_ID}"
          container="${network}-gateway"
          trap 'docker rm -fv "$container" >/dev/null 2>&1 || true; docker network rm "$network" >/dev/null 2>&1 || true' EXIT
          docker network create "$network"
          docker run -d --name "$container" --network "$network" --network-alias gateway --pull always \
            -e GATEWAY_API_KEY=contract-test \
            -v "$PWD/tests/fixtures/livesync-scopes.json:/etc/livesync-scopes/scopes.json:ro" \
            -e LIVESYNC_SCOPES_FILE=/etc/livesync-scopes/scopes.json \
            -e SYNC_ON_READ=false -e SYNC_ON_WRITE=false \
            -e 'LIVESYNC_SETTINGS_JSON={"isConfigured":true,"couchDB_URI":"http://127.0.0.1:1","couchDB_DBNAME":"test","couchDB_USER":"test","couchDB_PASSWORD":"test","useIndexedDBAdapter":false,"liveSync":false,"syncOnStart":false}' \
            registry.home.destinesiastudio.com/destinesiastudio/livesync-api-gateway:latest
          docker run --rm --network "$network" -v "$PWD:/src" -w /src \
            -e OIKB_TEST_GATEWAY_URL=http://gateway:9000 -e OIKB_TEST_GATEWAY_TOKEN=contract-test \
            -e LIVESYNC_SCOPES_FILE=/src/tests/fixtures/livesync-scopes.json \
            ghcr.io/astral-sh/uv:0.11.29-python3.11-bookworm-slim \
            sh -ec 'UV_PROJECT_ENVIRONMENT=/tmp/test-venv uv run --frozen --extra dev pytest -q tests/test_gateway_contract.py'

  build:
    needs: [test]
    if: gitea.event_name != 'pull_request'
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: docker-build-amd64
          - arch: arm64
            runner: docker-build-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: merrymaybe-bot
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push oikb
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: use 1-128 letters, digits, underscores, dots or hyphens; start with a letter, digit or underscore." >&2
            exit 1
          fi

          OWNER="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${OWNER}/oikb"
          # Separate run/platform tags keep parallel builds from overwriting
          # each other or publishing an incomplete user-facing image tag.
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          BUILD_TAG="build-${BUILD_RUN_ID}-${SHA}-${ARCH}"

          docker build \
            --platform "linux/${ARCH}" \
            --file Dockerfile \
            --tag "${IMAGE}:${BUILD_TAG}" \
            .
          docker push "${IMAGE}:${BUILD_TAG}"

          printf 'Built linux/%s: %s:%s\n' "$ARCH" "$IMAGE" "$BUILD_TAG"

  publish:
    name: Publish multi-platform image
    needs: [build]
    runs-on: docker-build-amd64
    steps:
      - name: Ensure Buildx is available for manifest publishing
        uses: docker/setup-buildx-action@v3
        with:
          # Registry manifest operations do not need a dedicated BuildKit container.
          driver: docker

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: merrymaybe-bot
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Publish combined image
        shell: bash
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${OWNER}/oikb"
          BUILD_TAG="build-${BUILD_RUN_ID}-${SHA}"

          docker buildx imagetools create \
            --tag "${IMAGE}:${IMAGE_TAG}" \
            --tag "${IMAGE}:${SHA}" \
            "${IMAGE}:${BUILD_TAG}-amd64" \
            "${IMAGE}:${BUILD_TAG}-arm64"

          docker buildx imagetools inspect "${IMAGE}:${SHA}"
          printf 'Published %s:%s\nPublished %s:%s\n' "$IMAGE" "$IMAGE_TAG" "$IMAGE" "$SHA"
